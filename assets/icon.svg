<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b9bff"/>
      <stop offset="1" stop-color="#3a6fe0"/>
    </linearGradient>
  </defs>

  <!-- 底板 -->
  <rect width="128" height="128" rx="28" fill="url(#g)"/>

  <!-- 四块大小不一的面板：来自不同进程的界面碎片 -->
  <rect x="20" y="20" width="46" height="32" rx="7" fill="#ffffff"/>
  <rect x="74" y="20" width="34" height="32" rx="7" fill="#ffffff" opacity="0.72"/>
  <rect x="20" y="62" width="32" height="46" rx="7" fill="#ffffff" opacity="0.72"/>
  <rect x="60" y="62" width="48" height="46" rx="7" fill="#ffffff"/>

  <!-- 缝合线 -->
  <path d="M16 57 H112" stroke="#0b0c0f" stroke-width="4"
        stroke-dasharray="7 6" stroke-linecap="round" opacity="0.5"/>
</svg>
