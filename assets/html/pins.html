<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>贴图模式 · Frankenstein</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%234c8dff'/%3E%3Crect x='3' y='4' width='5' height='3.5' rx='1' fill='%23fff'/%3E%3Crect x='9.5' y='4' width='3.5' height='3.5' rx='1' fill='%23fff' opacity='.7'/%3E%3Crect x='3' y='9' width='3.5' height='3.5' rx='1' fill='%23fff' opacity='.7'/%3E%3Crect x='8' y='9' width='5' height='3.5' rx='1' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/css/style.css">
<link rel="stylesheet" href="/static/css/canvas.css">
</head>
<body class="canvas-mode">
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <h1>Frankenstein</h1>
      <nav class="mode-switch" aria-label="模式">
        <a href="/pins" class="on">贴图</a>
        <a href="/">画布</a>
      </nav>
      <span class="chip" id="platform">—</span>
    </div>
    <div class="actions">
      <button id="btn-capture" class="btn primary">✂️ 截取当前窗口</button>
    </div>
  </header>

  <main class="pins-wrap">
    <section class="pins-hero">
      <h2>按 <kbd id="hotkey">Ctrl + Alt + P</kbd> 截取当前聚焦的窗口</h2>
      <p>截下来的画面会<b>贴在桌面最上层</b>，直接点它就能操作原程序 ——
         但<b>不会</b>把原窗口唤到前台，鼠标也不会被拽走。</p>
      <p class="muted">适合把十几个后台进程的操作按钮，摊在一屏上随时点。</p>
    </section>

    <div class="pins-head">
      <h3>桌面上的贴图</h3>
      <span class="chip" id="pin-count">0</span>
    </div>
    <div id="pin-grid" class="pin-grid"></div>
    <div id="pin-empty" class="pins-empty">
      还没有贴图。按快捷键，或点右上角「截取当前窗口」。
    </div>
  </main>

  <div id="toast" class="toast" hidden></div>
  <script src="/static/js/pins.js"></script>
</body>
</html>
